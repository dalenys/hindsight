name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two independent uv packages, each owning its own lockfile.
        package:
          - ingesters/chat_exports
          - mcp_server
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package }}/uv.lock

      # Reproducible install from the committed lockfile; fails if it is stale.
      - name: Sync dependencies
        run: uv sync --frozen

      # DB/OpenAI are mocked in mcp_server; the ingester's integration test is
      # gated on HINDSIGHT_TEST_DATABASE_URL (unset here) and skips — so no
      # Postgres service or secrets are required.
      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Lint
        run: uv run ruff check src/ tests/
