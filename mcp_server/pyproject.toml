[project]
name = "hindsight-mcp"
version = "0.1.0"
description = "Substrate 0 MCP server exposing semantic search over hindsight (personal chat-history corpus)."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "openai>=1.50",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hindsight-mcp = "hindsight_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight_mcp"]
