[project]
name = "chat-ingester"
version = "0.1.0"
description = "Substrate 0 ingester for Claude and ChatGPT conversation exports."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "tiktoken>=0.8",
]

[project.scripts]
chat-ingester = "chat_ingester.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_ingester"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
